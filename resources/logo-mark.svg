<!-- .WORKS mark — page with chunky W, drawn on a 1024 grid, transparent background -->
<g id="mark">
  <!-- chunky drop shadow (SuperEssence style) -->
  <path transform="translate(26,30)" fill="#2b2b2b" d="M300 196 H640 L760 316 V820 Q760 846 734 846 H300 Q274 846 274 820 V222 Q274 196 300 196 Z"/>
  <!-- page -->
  <path fill="#FFCB1F" d="M300 196 H640 L760 316 V820 Q760 846 734 846 H300 Q274 846 274 820 V222 Q274 196 300 196 Z"/>
  <!-- folded corner -->
  <path fill="#E0A800" d="M640 196 V292 Q640 316 664 316 H760 Z"/>
  <!-- W shadow -->
  <polyline transform="translate(10,12)" points="348,418 428,690 517,482 606,690 686,418" fill="none" stroke="#B88A00" stroke-width="88" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- W -->
  <polyline points="348,418 428,690 517,482 606,690 686,418" fill="none" stroke="#0B0B0B" stroke-width="88" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- text lines -->
  <rect x="340" y="756" width="230" height="22" rx="11" fill="#0B0B0B" opacity=".85"/>
  <rect x="590" y="756" width="104" height="22" rx="11" fill="#0B0B0B" opacity=".35"/>
  <!-- the dot of .WORKS -->
  <circle cx="190" cy="800" r="58" fill="#2b2b2b" transform="translate(14,16)"/>
  <circle cx="190" cy="800" r="58" fill="#FFFFFF"/>
</g>
