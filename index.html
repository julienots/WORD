<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>.WORKS</title>
  </head>
  <body>
    <!-- HOME -->
    <section id="home" class="screen active">
      <header class="home-head">
        <div class="brand">
          <img src="./icon.svg" alt="" class="brand-icon" />
          <div>
            <h1 class="wordmark"><span class="dot">.</span>WORKS</h1>
            <p class="studio">by <b>Super</b><b class="y">Essence</b> Studio</p>
          </div>
        </div>
      </header>

      <div class="actions">
        <button id="btn-new" class="card-btn">
          <span class="blank-page"></span>
          <span>Document vierge</span>
        </button>
        <button id="btn-open" class="card-btn">
          <span class="open-ico">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>Ouvrir un fichier Word</span>
        </button>
      </div>

      <h2 class="section-title">Récents</h2>
      <ul id="recent" class="recent"></ul>
      <p id="recent-empty" class="empty">Aucun document pour l'instant.<br />Importe un .docx ou crée un document vierge.</p>

      <footer class="home-foot">.WORKS · SuperEssence Studio · Compatible Microsoft Word (.docx)</footer>
    </section>

    <!-- EDITOR -->
    <section id="editor-screen" class="screen">
      <header class="titlebar">
        <button id="btn-back" class="icon-btn" title="Accueil" aria-label="Accueil">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="mini-logo"><span class="dot">.</span>W</span>
        <input id="doc-name" class="doc-name" spellcheck="false" value="Document1" aria-label="Nom du document" />
        <span id="save-state" class="save-state"></span>
        <button id="btn-save" class="icon-btn" title="Enregistrer" aria-label="Enregistrer">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn" title="Fichier" aria-label="Menu Fichier">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </header>
      <div class="ribbon">
        <nav id="rb-tabs" class="rb-tabs"></nav>
        <div id="rb-panel" class="rb-panel">
          <div class="rb-builtin"><div id="toolbar"></div></div>
          <div id="rb-extra" class="rb-extra"></div>
        </div>
      </div>
      <div id="ruler" class="ruler-host"></div>
      <main id="doc-scroll" class="doc-scroll">
        <div id="editor"></div>
      </main>
      <footer class="statusbar">
        <span id="status-left">Page 1</span>
        <span class="spacer"></span>
        <button id="zoom-out" class="zoom-btn" aria-label="Zoom arrière">−</button>
        <button id="zoom-fit" class="zoom-val" title="Ajuster à la largeur">100%</button>
        <button id="zoom-in" class="zoom-btn" aria-label="Zoom avant">+</button>
      </footer>
    </section>

    <!-- FILE MENU -->
    <div id="menu" class="sheet hidden" role="dialog" aria-label="Fichier">
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <button data-act="save"><b>Enregistrer</b><small>Dans .WORKS et dans Documents/.WORKS</small></button>
        <button data-act="share"><b>Partager / Ouvrir dans Word</b><small>Envoie le .docx vers Word, Drive, mail…</small></button>
        <button data-act="download"><b>Télécharger le .docx</b><small>Copie dans le dossier Téléchargements</small></button>
        <button data-act="open"><b>Ouvrir un autre fichier</b><small>Importer un .docx</small></button>
        <button data-act="new"><b>Nouveau document</b><small>Document vierge</small></button>
        <button data-act="about"><b>À propos</b><small>.WORKS par SuperEssence Studio</small></button>
        <button data-act="close" class="muted">Fermer</button>
      </div>
    </div>

    <div id="dialog-host"></div>
    <div id="toast" class="toast"></div>
    <div id="loader" class="loader hidden"><div class="spin"></div><p>Ouverture…</p></div>
    <input id="file-input" type="file" hidden
      accept=".docx,.docm,.dotx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
